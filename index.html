<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>HEL16 Site Tracker</title>
<meta name="theme-color" content="#1a1f25">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HEL16">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one shared HEL16 site dataset (COLO 1-5 + ADMIN, one area loaded at a time), three team apps (Installers / Testers / QA-QC) each opened by its own link; phone-first, sticky team header, boards -> circuits -> one sheet per circuit. */
:root {
  --bg: #eef0f2; --surface: #ffffff; --sunk: #e3e7eb; --ink: #1a1f25; --muted: #5b6570; --line: #d3d9df;
  --hivis: #f2a900; --hivis-ink: #1a1f25;
  --done: #1d8a4c; --done-bg: #d9f1e2; --part: #a86400; --part-bg: #fbecd0; --todo: #b3261e; --todo-bg: #f9dedc;
  --block: #c2410c; --block-bg: #fde3d3; --focus: #2364d2;
  --t-install: #f2a900; --t-test: #1c7ed6; --t-qa: #7048e8; --team: var(--hivis); --team-ink: #1a1f25;
  --plate: #ffffff; /* the OKEE logo is black and red on white, so it keeps a white plate in both themes */
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111418; --surface: #1a1f25; --sunk: #232930; --ink: #e7ebef; --muted: #9aa4af; --line: #2e353d;
  --hivis: #ffb81c; --hivis-ink: #111418; --done: #5cc98a; --done-bg: #183a27; --part: #f0b357; --part-bg: #3a2c12;
  --todo: #f2918a; --todo-bg: #3d1d1b; --block: #ff9a62; --block-bg: #40230f; --focus: #7aa7ff;
  --t-install: #ffb81c; --t-test: #4dabf7; --t-qa: #9775fa; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111418; --surface: #1a1f25; --sunk: #232930; --ink: #e7ebef; --muted: #9aa4af; --line: #2e353d;
  --hivis: #ffb81c; --hivis-ink: #111418; --done: #5cc98a; --done-bg: #183a27; --part: #f0b357; --part-bg: #3a2c12;
  --todo: #f2918a; --todo-bg: #3d1d1b; --block: #ff9a62; --block-bg: #40230f; --focus: #7aa7ff;
  --t-install: #ffb81c; --t-test: #4dabf7; --t-qa: #9775fa; color-scheme: dark; }
body.team-install { --team: var(--t-install); --team-ink: #1a1f25; }
body.team-test { --team: var(--t-test); --team-ink: #ffffff; }
body.team-qa { --team: var(--t-qa); --team-ink: #ffffff; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--ink); color: var(--bg); border-bottom: 5px solid var(--team); }
.top-in { max-width: 1040px; margin: 0 auto; padding: 10px 16px 0; display: grid; gap: 8px; }
.brand { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.plate { background: var(--plate); border-radius: 6px; padding: 4px 8px; display: inline-flex; align-items: center; }
.plate .logo { height: 26px; width: auto; display: block; }
.brand h1 { font-size: 22px; line-height: 1; text-transform: uppercase; }
.teamtag { font: 700 13px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; background: var(--team); color: var(--team-ink); padding: 5px 8px; border-radius: 4px; }
.colosel { font: 700 14px/1 var(--f-display); letter-spacing: .05em; text-transform: uppercase; background: rgb(255 255 255 / .12); color: inherit; border: 1px solid rgb(255 255 255 / .35); border-radius: 6px; padding: 6px 8px; min-height: 34px; }
.colosel option { color: #111; }
.pilot { font: 600 10px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; border: 1px solid rgb(255 255 255 / .4); padding: 4px 6px; border-radius: 3px; }
.hold { margin-left: auto; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: rgb(255 255 255 / .12); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.hold i { width: 8px; height: 8px; border-radius: 50%; background: #5cc98a; display: inline-block; }
.hold.held i { background: var(--hivis); } .hold.off i { background: #f2918a; }
@media (max-width: 520px) { .brand h1 { font-size: 19px; flex-basis: 100%; order: 4; } }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs button, .tabs a { background: none; border: 0; color: inherit; opacity: .7; padding: 10px 12px 11px; font: 600 15px/1 var(--f-display); letter-spacing: .05em; text-transform: uppercase; border-bottom: 3px solid transparent; white-space: nowrap; text-decoration: none; }
.tabs [aria-selected="true"] { opacity: 1; border-bottom-color: var(--team); }
.tabs .home { margin-left: auto; }

main { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 96px; display: grid; gap: 16px; }
.banner { padding: 10px 12px; border-radius: var(--r); background: var(--sunk); color: var(--muted); font-size: 14px; }
.banner.warn { background: var(--part-bg); color: var(--part); }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); }
.empty h2 { color: var(--ink); font-size: 22px; margin-bottom: 6px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; min-height: 40px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* landing */
.teams { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.tcard { text-align: left; text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--line); border-top: 6px solid var(--c); border-radius: var(--r); padding: 16px; display: grid; gap: 8px; }
.tcard h2 { font-size: 28px; text-transform: uppercase; }
.tcard p { margin: 0; color: var(--muted); font-size: 14px; }
.tcard .go { font: 700 14px var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--c); }
.flow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.flow b { background: var(--sunk); color: var(--ink); padding: 3px 8px; border-radius: 4px; font: 700 13px var(--f-display); letter-spacing: .04em; }

.boards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.bcard { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 8px; }
.bcard:hover { border-color: var(--muted); }
.bh { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.bn { font: 700 19px/1.1 var(--f-display); }
.ba { font-size: 12px; color: var(--muted); }
.ladder { display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); gap: 4px; }
.rung { display: grid; gap: 3px; }
.rung .lbl { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--done); }
.rung .v { font: 500 12px var(--f-mono); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.fail { background: var(--todo-bg); color: var(--todo); } .chip.ok { background: var(--done-bg); color: var(--done); }
.chip.part { background: var(--part-bg); color: var(--part); } .chip.team { background: var(--team); color: var(--team-ink); }
.chip.held { background: var(--hivis); color: var(--hivis-ink); } .chip.block { background: var(--block-bg); color: var(--block); }

.back { background: none; border: 0; padding: 6px 0; color: var(--muted); font-weight: 600; justify-self: start; }
.bhead { display: grid; gap: 10px; }
.bhead h2 { font-size: 28px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tools input[type=search] { flex: 1 1 200px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 12px; min-height: 42px; }
.clist { display: grid; gap: 6px; }
.crow { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px 10px; align-items: center; }
.crow.inactive { background: transparent; border-style: dashed; color: var(--muted); }
.crow.failed { border-left: 4px solid var(--todo); } .crow.signed { border-left: 4px solid var(--t-qa); } .crow.blocked { border-left: 4px solid var(--block); }
.cinfo { min-width: 0; display: grid; gap: 2px; background: none; border: 0; padding: 0; text-align: left; }
.r1 { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.circ { font: 700 17px/1 var(--f-display); }
.ref { font: 500 11px var(--f-mono); color: var(--muted); }
.desc { font-size: 14px; overflow-wrap: anywhere; }
.meta { font-size: 12px; color: var(--muted); }
.steps { display: flex; gap: 4px; }
.sbtn { min-width: 52px; min-height: 48px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; align-content: center; gap: 1px; padding: 2px 4px; }
.sbtn .k { font: 700 13px/1 var(--f-display); letter-spacing: .04em; }
.sbtn .d { font: 500 9px/1 var(--f-mono); color: var(--muted); }
.sbtn.on { background: var(--done-bg); border-color: var(--done); color: var(--done); } .sbtn.on .d { color: var(--done); }
.sbtn.now { background: var(--done); color: var(--surface); } .sbtn.now .d { color: var(--surface); }
.sbtn.fail { background: var(--todo-bg); border-color: var(--todo); color: var(--todo); }
.sbtn.part { background: var(--part-bg); border-color: var(--part); color: var(--part); }
.sbtn.lock { border-style: dashed; color: var(--muted); }
.sbtn.ready { border-color: var(--t-qa); color: var(--t-qa); }
.sbtn.qa { background: var(--t-qa); border-color: var(--t-qa); color: #fff; } .sbtn.qa .d { color: #fff; }
.sbtn:disabled { cursor: default; opacity: .55; }
.others { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 3px; }
.others b { font: 700 10px var(--f-display); letter-spacing: .04em; padding: 1px 5px; border-radius: 3px; background: var(--sunk); color: var(--muted); }
.others b.on { background: var(--done-bg); color: var(--done); } .others b.fail { background: var(--todo-bg); color: var(--todo); }
@media (max-width: 600px) { .crow { grid-template-columns: 1fr; } .steps { justify-content: space-between; } .sbtn { flex: 1 1 0; min-width: 0; } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; min-width: 0; }
.panel h3 { font-size: 18px; text-transform: uppercase; letter-spacing: .04em; }
.ph { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
th { font: 600 11px/1.2 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
th:first-child, td:first-child, td.l, th.l { text-align: left; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--sunk); }
td.bad { color: var(--todo); font-weight: 700; } td.z { color: var(--line); }
tr.cellrow td { background: var(--sunk); font-weight: 700; } tr.tot td { font-weight: 700; border-top: 2px solid var(--ink); }
table.sheet th, table.sheet td { font-size: 12px; padding: 4px 6px; border: 1px solid var(--line); }
table.sheet th { white-space: normal; min-width: 54px; vertical-align: bottom; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; min-height: 42px; font-weight: 600; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.team { background: var(--team); color: var(--team-ink); border-color: var(--team); }
.btn.danger { color: var(--todo); }
.btn:disabled { opacity: .5; cursor: default; }
select.sel { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; min-height: 42px; }

.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .45); z-index: 40; display: grid; align-items: end; justify-items: center; }
.sheet { background: var(--bg); width: min(760px, 100%); max-height: 94vh; overflow-y: auto; border-radius: 14px 14px 0 0; padding: 14px 14px calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
.sh { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.sheet h2 { font-size: 24px; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px 14px; font-size: 13px; }
.kv span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; }
.step.ok { border-color: var(--done); } .step.fail { border-color: var(--todo); }
.sth { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.sth h3 { font-size: 18px; text-transform: uppercase; letter-spacing: .03em; }
.by { font-size: 12px; color: var(--muted); }
.checks { display: grid; gap: 6px; }
.chk { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--sunk); min-height: 44px; }
.chk input { width: 22px; height: 22px; accent-color: var(--done); flex: none; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.fld { display: grid; gap: 3px; align-content: start; }
.fld label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.fld input, .fld select, .fld textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; min-height: 42px; width: 100%; }
.fld input.bad { border-color: var(--todo); background: var(--todo-bg); }
.fld .hint { font-size: 11px; color: var(--muted); }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { border: 1px solid var(--team); background: transparent; color: var(--ink); border-radius: 6px; padding: 6px 12px; min-height: 36px; font: 600 13px var(--f-mono); }
.quick button:active { background: var(--team); color: var(--team-ink); }
.col { font: 500 10px var(--f-mono); color: var(--muted); }
.verdict { font: 700 16px var(--f-display); letter-spacing: .04em; text-transform: uppercase; padding: 6px 10px; border-radius: 6px; }
.verdict.ok { background: var(--done-bg); color: var(--done); } .verdict.fail { background: var(--todo-bg); color: var(--todo); } .verdict.inc { background: var(--sunk); color: var(--muted); }
.req { display: grid; gap: 4px; }
.req div { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.req i { font-style: normal; font-weight: 700; width: 18px; text-align: center; }
.req .y i { color: var(--done); } .req .n i { color: var(--todo); }
.req small { color: var(--muted); }
.photos { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.thumb { width: 72px; height: 72px; border-radius: 8px; object-fit: cover; border: 1px solid var(--line); background: var(--sunk); cursor: zoom-in; }
.thumbwrap { position: relative; } .thumbwrap .chip { position: absolute; left: 2px; bottom: 2px; font-size: 10px; padding: 1px 5px; }
.addph { width: 72px; height: 72px; border-radius: 8px; border: 2px dashed var(--muted); display: grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--muted); background: transparent; }
.viewer { position: fixed; inset: 0; z-index: 60; background: rgb(0 0 0 / .88); display: grid; place-items: center; padding: 16px; }
.viewer img { max-width: 100%; max-height: 82vh; border-radius: 8px; } .viewer .cap { color: #fff; font-size: 13px; margin-top: 8px; text-align: center; }
.qrgrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.qrcard { background: var(--plate); color: #111; border-radius: var(--r); padding: 12px; display: grid; gap: 6px; justify-items: center; text-align: center; border: 1px solid var(--line); }
.qrcard svg { width: 140px; height: 140px; } .qrcard b { font: 700 17px var(--f-display); } .qrcard small { font-size: 11px; color: #444; }
.feed .ev { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.feed .t { font-size: 14px; overflow-wrap: anywhere; } .feed .w { font-size: 12px; color: var(--muted); white-space: nowrap; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 70; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 12px 10px 16px; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgb(0 0 0 / .25); font-size: 14px; display: flex; gap: 12px; align-items: center; }
.toast button { background: var(--hivis); color: var(--hivis-ink); border: 0; border-radius: 6px; padding: 6px 12px; font-weight: 700; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: up .18s ease-out; } @keyframes up { from { transform: translate(-50%, 12px); opacity: 0; } } }

/* sign-in gate and account button (offline app) */
#gate { position: fixed; inset: 0; z-index: 80; background: var(--bg); display: grid; place-items: center; padding: 24px 16px; overflow-y: auto; }
#gate .gbox { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-top: 6px solid var(--hivis); border-radius: var(--r); padding: 20px; display: grid; gap: 12px; }
#gate .gplate { background: var(--plate); border-radius: 6px; padding: 6px 10px; justify-self: start; } #gate .gplate img { height: 30px; display: block; }
#gate h2 { font-size: 26px; text-transform: uppercase; } #gate p { margin: 0; color: var(--muted); font-size: 15px; }
#gate .gerr { color: var(--todo); background: var(--todo-bg); padding: 8px 10px; border-radius: 8px; }
#gate .gbtn { min-height: 48px; border-radius: 8px; border: 0; background: var(--ink); color: var(--bg); font: 700 17px var(--f-display); letter-spacing: .05em; text-transform: uppercase; }
#gate .gbtn.alt { background: transparent; color: var(--ink); border: 1px solid var(--line); }
#gate .gl { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
#gate .gl input { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 12px; min-height: 46px; font: 16px var(--f-body); color: var(--ink); text-transform: none; letter-spacing: 0; }
#gate .glinks { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; } #gate .glink { background: none; border: 0; color: var(--focus); padding: 6px 0; font-weight: 600; }
.acct { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--team); background: rgb(255 255 255 / .12); color: inherit; font: 700 16px var(--f-display); flex: none; }
</style>

<header class="top">
