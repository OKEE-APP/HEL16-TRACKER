<title>HEL16 Site Progress</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: read-only snapshot of the HEL16 site tracker for anyone with the link; site -> area -> board -> circuits, opened straight to a board by its QR label. Same palette as the site tracker. */
:root {
  --bg: #eef0f2; --surface: #ffffff; --sunk: #e3e7eb; --ink: #1a1f25; --muted: #5b6570; --line: #d3d9df;
  --hivis: #f2a900; --done: #1d8a4c; --done-bg: #d9f1e2; --part: #a86400; --part-bg: #fbecd0;
  --block: #c2410c; --block-bg: #fde3d3; --focus: #2364d2; --plate: #ffffff; --head: #1a1f25; --head-ink: #eef0f2;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111418; --surface: #1a1f25; --sunk: #232930; --ink: #e7ebef; --muted: #9aa4af; --line: #2e353d;
  --hivis: #ffb81c; --done: #5cc98a; --done-bg: #183a27; --part: #f0b357; --part-bg: #3a2c12;
  --block: #ff9a62; --block-bg: #40230f; --focus: #7aa7ff; --head: #000000; --head-ink: #e7ebef; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111418; --surface: #1a1f25; --sunk: #232930; --ink: #e7ebef; --muted: #9aa4af; --line: #2e353d;
  --hivis: #ffb81c; --done: #5cc98a; --done-bg: #183a27; --part: #f0b357; --part-bg: #3a2c12;
  --block: #ff9a62; --block-bg: #40230f; --focus: #7aa7ff; --head: #000000; --head-ink: #e7ebef; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; }
a { color: inherit; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--head); color: var(--head-ink); border-bottom: 5px solid var(--hivis); }
.top .wrap { padding-block: 10px 0; display: grid; gap: 8px; }
.brand { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.plate { background: var(--plate); border-radius: 6px; padding: 4px 8px; display: inline-flex; }
.plate img { height: 26px; width: auto; display: block; }
.brand h1 { font-size: 22px; line-height: 1; text-transform: uppercase; }
.ro { font: 600 10px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; border: 1px solid rgb(255 255 255 / .4); padding: 4px 6px; border-radius: 3px; }
.stamp { margin-left: auto; font-size: 12px; opacity: .85; white-space: nowrap; }
@media (max-width: 520px) { .brand h1 { font-size: 19px; } .stamp { margin-left: 0; flex-basis: 100%; } }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs a { opacity: .7; padding: 10px 12px 11px; font: 600 15px/1 var(--f-display); letter-spacing: .05em; text-transform: uppercase; border-bottom: 3px solid transparent; white-space: nowrap; text-decoration: none; }
.tabs a[aria-current="page"] { opacity: 1; border-bottom-color: var(--hivis); }
main.wrap { padding-block: 16px 64px; display: grid; gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; min-width: 0; }
.ph { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.ph h2 { font-size: 26px; text-transform: uppercase; } .ph h3 { font-size: 19px; text-transform: uppercase; }
.ph .sub { color: var(--muted); font-size: 13px; }
.crumb { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.stages { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.stage { background: var(--sunk); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
.stage span { font: 600 12px/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stage b { font: 700 30px/1 var(--f-display); }
.stage small { color: var(--muted); font-size: 12px; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--part); }
.bar i.full { background: var(--done); }
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { font: 600 11px/1.2 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
tr.go { cursor: pointer; } tr.go:hover td { background: var(--sunk); }
td a { text-decoration: none; font-weight: 600; } td small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
.pc.full { color: var(--done); font-weight: 600; } .pc.zero { color: var(--muted); }
.chip { display: inline-block; font: 600 11px/1 var(--f-body); padding: 4px 7px; border-radius: 999px; background: var(--block-bg); color: var(--block); white-space: nowrap; }
.chip.grey { background: var(--sunk); color: var(--muted); }
.cellh { font: 700 15px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-top: 4px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { font: 600 13px/1 var(--f-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 8px 12px; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.circs { display: grid; }
.circ { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.circ .ref { font-family: var(--f-mono); font-size: 13px; }
.circ .ds { min-width: 0; } .circ .ds small { display: block; color: var(--muted); font-size: 12px; }
.circ.off { opacity: .55; }
.dots { display: grid; grid-template-columns: repeat(6, 26px); gap: 4px; }
.dots i { width: 26px; height: 22px; border-radius: 4px; border: 1.5px solid var(--line); display: grid; place-items: center; font: 700 10px/1 var(--f-display); font-style: normal; color: var(--muted); }
.dots i.y { background: var(--done-bg); border-color: var(--done); color: var(--done); }
.dhead { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 12px; font: 600 11px/1 var(--f-body); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.dhead .dots i { border: 0; height: auto; }
@media (max-width: 600px) { .circ, .dhead { grid-template-columns: 74px minmax(0, 1fr); } .circ .dots { grid-column: 2; } .dhead .dots { display: none; } }
.key { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.key b { font: 700 12px/1 var(--f-display); color: var(--ink); }
.teamlinks { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.teamlinks a { font: 600 13px/1 var(--f-body); text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; color: var(--ink); }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.foot { color: var(--muted); font-size: 12px; }
</style>

<script>
const AREAS = [['ADMIN','ADMIN'],['COLO1','COLO 1'],['COLO2','COLO 2'],['COLO3','COLO 3'],['COLO4','COLO 4'],['COLO5','COLO 5']];
let D = { at: '', areas: AREAS, boards: [] }, byId = {}, loaded = false, loadErr = '';
const CACHE_KEY = 'hel16.progress';
const fmtAt = ms => ms ? new Date(ms).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
function setData(boards, at) { D = { at: fmtAt(at), areas: AREAS, boards }; byId = Object.fromEntries(boards.map(b => [b.b, b])); loaded = true; }
try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (c && c.boards) setData(c.boards, c.at); } catch (e) {}
// live, progress-only copy of the tracker (no test readings, notes or names); readable without signing in
async function load() {
  const cfg = window.HEL16_CONFIG.firebase, boards = []; let at = 0, token = '';
  try {
    do {
      const r = await fetch('https://firestore.googleapis.com/v1/projects/' + cfg.projectId + '/databases/(default)/documents/progress?pageSize=300&key=' + cfg.apiKey + (token ? '&pageToken=' + encodeURIComponent(token) : ''));
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json(); token = j.nextPageToken || '';
      (j.documents || []).forEach(d => { const f = d.fields || {}; try { boards.push(JSON.parse(f.j.stringValue)); } catch (e) {} at = Math.max(at, +((f.at && (f.at.integerValue || f.at.doubleValue)) || 0)); });
    } while (token);
    setData(boards, at); loadErr = '';
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ boards, at })); } catch (e) {}
  } catch (e) { loadErr = loaded ? 'No connection. Showing the last progress this device saw.' : 'Could not load progress. Check your signal and try again.'; }
  render();
}
const APP_URL = './';
const ST = [['inst','Pulled','P'],['bt','Board term','B'],['ft','Field term','F'],['te','Tested','T'],['lab','Labelled','L'],['qa','QA signed','Q']];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const areaName = c => (D.areas.find(a => a[0] === c) || [c, c])[1];
let filter = 'all';

function tally(boards) {
  const t = { n: 0, s: [0,0,0,0,0,0], blk: 0 };
  boards.forEach(b => { const x = b.t || {}; t.n += x.n || 0; t.blk += x.blk || 0; ST.forEach((_, i) => { t.s[i] += (x.s && x.s[i]) || 0; }); });
  return t;
}
// round up, but only a finished set shows 100%
const pct = (x, n) => !n ? 0 : x >= n ? 100 : Math.min(99, Math.ceil(100 * x / n - 1e-9));
const pcCell = (x, n) => { const p = pct(x, n); return '<td class="num pc' + (p === 100 ? ' full' : p === 0 ? ' zero' : '') + '">' + p + '%</td>'; };
function stageTiles(t) {
  return '<div class="stages">' + ST.map((s, i) => { const p = pct(t.s[i], t.n);
    return '<div class="stage"><span>' + s[1] + '</span><b class="num">' + p + '%</b><div class="bar"><i class="' + (p === 100 ? 'full' : '') + '" style="width:' + p + '%"></i></div><small class="num">' + t.s[i] + ' of ' + t.n + ' circuits</small></div>'; }).join('') + '</div>';
}
const stageHead = first => '<tr><th>' + first + '</th><th>Circuits</th>' + ST.map(s => '<th>' + s[1] + '</th>').join('') + '<th>Blocked</th></tr>';
const blkCell = n => '<td>' + (n ? '<span class="chip">' + n + '</span>' : '<span class="pc zero">0</span>') + '</td>';

function viewSite() {
  const all = tally(D.boards);
  const rows = D.areas.map(([code, label]) => { const t = tally(D.boards.filter(b => b.c === code));
    return '<tr class="go" data-go="' + code + '"><td><a href="#' + code + '">' + esc(label) + '</a></td><td class="num">' + t.n + '</td>' + t.s.map(x => pcCell(x, t.n)).join('') + blkCell(t.blk) + '</tr>'; }).join('');
  return '<section class="panel"><div class="ph"><h2>Whole site</h2><span class="sub num">' + all.n + ' active circuits across ' + D.boards.length + ' boards</span></div>' + stageTiles(all) + '</section>' +
    '<section class="panel"><div class="ph"><h3>By area</h3><span class="sub">Tap an area to see its boards</span></div><div class="tbl"><table>' + stageHead('Area') + rows + '</table></div></section>';
}

function viewArea(code) {
  const boards = D.boards.filter(b => b.c === code).sort((a, b) => a.o - b.o || a.b.localeCompare(b.b));
  if (!boards.length) return '<div class="panel empty">No boards in this area yet.</div>';
  const t = tally(boards); const cells = [...new Set(boards.map(b => b.cell))];
  const body = cells.map(cell => (cells.length > 1 ? '<tr><td colspan="' + (ST.length + 3) + '" class="cellh">' + esc(cell === code ? areaName(code) : cell) + '</td></tr>' : '') +
    boards.filter(b => b.cell === cell).map(b => { const bt = tally([b]);
      return '<tr class="go" data-go="' + esc(b.b) + '"><td><a href="#' + esc(b.b) + '">' + esc(b.b.replace(code + '-', '')) + '</a><small>' + esc(b.area) + '</small></td><td class="num">' + bt.n + '</td>' + bt.s.map(x => pcCell(x, bt.n)).join('') + blkCell(bt.blk) + '</tr>'; }).join('')).join('');
  return '<section class="panel"><div class="crumb"><a href="#">Site</a><span>/</span><span>' + esc(areaName(code)) + '</span></div><div class="ph"><h2>' + esc(areaName(code)) + '</h2><span class="sub num">' + t.n + ' active circuits, ' + boards.length + ' boards</span></div>' + stageTiles(t) + '</section>' +
    '<section class="panel"><div class="ph"><h3>Boards</h3><span class="sub">Tap a board to see every circuit</span></div><div class="tbl"><table>' + stageHead('Board') + body + '</table></div></section>';
}

function viewBoard(b) {
  const t = tally([b]);
  const team = '<div class="teamlinks">Site team member? Open this board in the tracker: ' +
    [['install','Installers'],['test','Testers'],['qa','QA/QC']].map(x => '<a href="' + APP_URL + '#' + x[0] + '.' + esc(b.b) + '">' + x[1] + '</a>').join('') + '</div>';
  return '<section class="panel"><div class="crumb"><a href="#">Site</a><span>/</span><a href="#' + b.c + '">' + esc(areaName(b.c)) + '</a><span>/</span><span>' + esc(b.b) + '</span></div>' +
    '<div class="ph"><h2>' + esc(b.b) + '</h2><span class="sub">' + esc(b.area) + ' · <span class="num">' + t.n + '</span> active circuits' + (t.blk ? ' · <span class="num">' + t.blk + '</span> blocked' : '') + '</span></div>' + stageTiles(t) + team + '</section>';
}

function render() {
  const h = decodeURIComponent(location.hash.slice(1));
  const b = byId[h]; const area = b ? b.c : (D.areas.some(a => a[0] === h) ? h : '');
  document.getElementById('tabs').innerHTML = '<a href="#"' + (!area ? ' aria-current="page"' : '') + '>Site</a>' +
    D.areas.map(([c, l]) => '<a href="#' + c + '"' + (area === c ? ' aria-current="page"' : '') + '>' + esc(l) + '</a>').join('');
  document.getElementById('stamp').textContent = D.at ? 'Last change ' + D.at : '';
  if (!loaded) { document.getElementById('main').innerHTML = '<section class="panel empty">' + esc(loadErr || 'Loading site progress…') + '</section>'; return; }
  document.getElementById('main').innerHTML = (loadErr ? '<section class="panel empty">' + esc(loadErr) + '</section>' : '') + (b ? viewBoard(b) : area ? viewArea(area) : viewSite()) +
    '<p class="foot">Live progress from the HEL16 site tracker. View only: overall progress by area and board.</p>';
}
document.addEventListener('click', e => {
  const fb = e.target.closest('[data-f]'); if (fb) { filter = fb.dataset.f; render(); return; }
  const tr = e.target.closest('tr[data-go]'); if (tr && !e.target.closest('a')) { location.hash = tr.dataset.go; }
});
window.addEventListener('hashchange', () => { filter = 'all'; render(); window.scrollTo(0, 0); });
render(); load();
setInterval(() => { if (!document.hidden) load(); }, 120000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>

</body></html>
